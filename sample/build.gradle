apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services' // Firebase
apply plugin: 'com.google.firebase.crashlytics' // Firebase Crashlytics plugin.
apply plugin: 'com.google.firebase.firebase-perf' // Apply the Performance Monitoring plugin

android {
    namespace 'com.example.jean.jcplayersample'
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.example.jean.jcplayersample"
        minSdkVersion 14
        targetSdkVersion 34
        versionCode 4
        versionName "2.7.6"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}
}

// noinspection SpellCheckingInspection
dependencies {
    api fileTree(dir: 'libs', include: ['*.jar'])

    api project(path: ':jcplayer')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    //implementation 'com.github.josef130:JcPlayer:2.7.2'
    implementation 'com.daimajia.androidanimations:library:2.4@aar' // Jcplayer

    testImplementation 'junit:junit:4.13.2'

    implementation 'com.google.firebase:firebase-analytics:21.3.0'
    implementation 'com.google.firebase:firebase-crashlytics:18.2.9'
    implementation 'com.google.firebase:firebase-perf:19.1.1'
}
